<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Before first paint, so the boot screen is in the first frame or never. -->
    <script>
      (function () {
        try {
          var calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
          var lean = navigator.connection && navigator.connection.saveData;
          if (!calm && !lean) {
            document.documentElement.dataset.boot = "on";
            document.documentElement.dataset.bootLine = "l" + Math.floor(Math.random() * 6);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Spline+Sans:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
